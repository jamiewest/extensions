# Publishes a package to pub.dev when its release tag is pushed:
#   extensions-v0.7.2          -> packages/extensions
#   extensions_flutter-v0.5.3  -> packages/extensions_flutter
#
# Uses pub.dev automated publishing (GitHub OIDC — no secrets). One-time
# setup per package on pub.dev (Admin tab -> Automated publishing):
#   repository: jamiewest/extensions
#   tag pattern: extensions-v{{version}}         (extensions)
#   tag pattern: extensions_flutter-v{{version}} (extensions_flutter)
#   require GitHub Actions environment: pub.dev  (both)
#
# The environment name must match the `environment:` on the job below, or
# pub.dev refuses the token ("running in environment 'null'"). GitHub creates
# the pub.dev environment on the first run that names it. If you add
# deployment rules to it, allow the release tags: a "protected branches only"
# rule refuses every tag-triggered run.
#
# Tags are normally pushed automatically by auto-tag.yml when a version bump
# lands on main; pushing a tag by hand works the same way. When both packages
# bump, auto-tag.yml pushes the extensions_flutter tag only once extensions is
# live on pub.dev, since extensions_flutter depends on it.
#
# A tag-triggered run uses this file as of the TAGGED commit. "Re-run failed
# jobs" therefore picks up a fix made on pub.dev, but not a fix to this
# workflow: for that, delete the tag and re-run auto-tag.yml, which re-creates
# it at the current main.

name: Publish to pub.dev

on:
  push:
    tags:
      - 'extensions-v[0-9]+.[0-9]+.[0-9]+*'
      - 'extensions_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match "Require GitHub Actions environment" on pub.dev — see header.
    environment: pub.dev
    permissions:
      id-token: write  # required for pub.dev OIDC token exchange
    steps:
      - uses: actions/checkout@v4

      # Provisions the pub.dev OIDC token. Without this step `dart pub
      # publish` has no credential and hangs on interactive auth — the
      # flutter-action below shadows this dart but the token remains.
      - uses: dart-lang/setup-dart@v1

      - name: Resolve package and version from tag
        id: pkg
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          case "$PKG" in
            extensions|extensions_flutter) ;;
            *) echo "::error::unknown package prefix in tag $TAG"; exit 1 ;;
          esac
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' "${{ steps.pkg.outputs.dir }}/pubspec.yaml" | awk '{print $2}')
          if [ "$PUBSPEC_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.pkg.outputs.version }} but pubspec.yaml says $PUBSPEC_VERSION"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          flutter pub get
          dart pub publish --force
