name: Dart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (extensions)
        working-directory: ./packages/extensions
        run: dart pub get

      - name: Install dependencies (extensions_flutter)
        working-directory: ./packages/extensions_flutter
        run: flutter pub get

      # --fatal-infos is required, not belt-and-braces: every lint this repo
      # relies on (lines_longer_than_80_chars, the lints/recommended set)
      # reports at info severity, and a bare `dart analyze` exits 0 on those.
      - name: Analyze (extensions)
        working-directory: ./packages/extensions
        run: dart analyze --fatal-infos .

      - name: Analyze (extensions_flutter)
        working-directory: ./packages/extensions_flutter
        run: flutter analyze --fatal-infos

      # The tall-style formatter is gated on language version 3.7, so its
      # output is stable only while the SDK floor stays at ^3.13.0.
      - name: Verify formatting (extensions)
        working-directory: ./packages/extensions
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify formatting (extensions_flutter)
        working-directory: ./packages/extensions_flutter
        run: dart format --output=none --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (extensions)
        working-directory: ./packages/extensions
        run: dart pub get

      - name: Install dependencies (extensions_flutter)
        working-directory: ./packages/extensions_flutter
        run: flutter pub get

      - name: Run tests (extensions)
        working-directory: ./packages/extensions
        run: dart test --file-reporter json:../../test-results-extensions.json

      - name: Run tests (extensions_flutter)
        working-directory: ./packages/extensions_flutter
        run: flutter test --machine --no-pub > ../../test-results-flutter.json

      - name: Report extensions tests
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Extensions Tests
          path: test-results-extensions.json
          reporter: dart-json

      - name: Report Flutter tests
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Flutter Tests
          path: test-results-flutter.json
          reporter: flutter-json
